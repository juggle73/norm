services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: norm
      POSTGRES_PASSWORD: norm
      POSTGRES_DB: norm
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U norm -d norm"]
      interval: 2s
      timeout: 3s
      retries: 15
